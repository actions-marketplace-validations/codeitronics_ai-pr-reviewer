# Serve the demo at https://demos.codeitronics.com/pr-review through the Traefik that fronts n8n.
#
#   docker compose -p pr-review-demo -f compose.yaml -f deploy/compose.traefik.yaml up -d --build
#
# Express routes live at "/", so Traefik strips the /pr-review prefix and the app uses ROOT_PATH for links.
services:
  pr-review-demo:
    ports: !reset []
    networks: [proxy]
    labels:
      traefik.enable: "true"
      traefik.http.routers.pr-review-demo.rule: Host(`demos.codeitronics.com`) && PathPrefix(`/pr-review`)
      traefik.http.routers.pr-review-demo.entrypoints: websecure
      traefik.http.routers.pr-review-demo.tls.certresolver: mytlschallenge
      traefik.http.routers.pr-review-demo.middlewares: pr-review-demo-slash,pr-review-demo-strip
      traefik.http.middlewares.pr-review-demo-slash.redirectregex.regex: ^(https://[^/]+/pr-review)$$
      traefik.http.middlewares.pr-review-demo-slash.redirectregex.replacement: $${1}/
      traefik.http.middlewares.pr-review-demo-strip.stripprefix.prefixes: /pr-review
      traefik.http.services.pr-review-demo.loadbalancer.server.port: "4600"

networks:
  proxy:
    external: true
    name: n8n_default
